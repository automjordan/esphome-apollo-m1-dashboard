# =============================================================================
#  ROTAZIONE PAGINE
#  home viene inserita fra una pagina e l'altra, quindi resta quella dominante
# =============================================================================
interval:
  - interval: 7s
    then:
      - lambda: |-
          // un alert attivo blocca la rotazione
          id(next_page) = nullptr;

          // allarme scattato: batte qualsiasi altra cosa
          if (id(alarm_state).has_state() && id(alarm_state).state == "triggered") {
            if (id(matrix).get_active_page() != id(page_alarm))
              id(next_page) = id(page_alarm);
            return;
          }

          if (id(alert_until) != 0) {
            if (millis() < id(alert_until)) return;
            id(alert_until) = 0;
            id(rot_index) = 0;
            id(next_page) = id(page_home);
            return;
          }

          // di notte solo l'orologio
          if (id(night_mode)) {
            if (id(matrix).get_active_page() != id(page_home))
              id(next_page) = id(page_home);
            return;
          }

          std::vector<display::DisplayPage*> v;
          v.push_back(id(page_home));

          auto add = [&](display::DisplayPage* p) {
            v.push_back(p);
            v.push_back(id(page_home));
          };

          // la pagina energia serve anche di notte: se non produci, mostra
          // comunque il prelievo di casa quando e' significativo
          {
            float pv = id(pv_power).has_state() ? id(pv_power).state : 0;
            float gr = id(grid_power).has_state() ? id(grid_power).state : 0;
            if (std::isnan(pv)) pv = 0;
            if (std::isnan(gr)) gr = 0;
            float bp = id(batt_power).has_state() ? id(batt_power).state : 0;
            if (std::isnan(bp)) bp = 0;
            if (pv > 150 || fabsf(gr) > 300 || fabsf(bp) > 300) add(id(page_pv));
          }

          if (id(ev_charging).state)
            add(id(page_ev));

          bool piove_ora = id(rain_now).has_state()
                        && !std::isnan(id(rain_now).state)
                        && id(rain_now).state > 0;
          if (piove_ora
              || (id(rain_minutes).has_state() && id(rain_minutes).state >= 0
                  && id(rain_minutes).state <= 60))
            add(id(page_rain));

          // rasaerba: logica a esclusione, cosi' non dipende dal vocabolario
          // dell'integrazione. Mostro la pagina tranne che negli stati di riposo.
          if (id(mower_state).has_state()) {
            std::string ms = id(mower_state).state;
            for (auto &ch : ms) ch = tolower(ch);
            bool riposo = ms.empty()
                       || ms == "docked" || ms == "idle" || ms == "paused"
                       || ms == "unknown" || ms == "unavailable" || ms == "none"
                       || ms.find("base") != std::string::npos      // "alla base"
                       || ms.find("pausa") != std::string::npos
                       || ms.find("ricarica") != std::string::npos
                       || ms.find("carico") != std::string::npos;
            if (!riposo) add(id(page_mower));
          }

          if (id(pm25).has_state() && id(pm25).state >= ${pm25_warn})
            add(id(page_air));


          id(rot_index) = (id(rot_index) + 1) % v.size();
          // non decido qui il cambio: lo annuncio, la dissolvenza lo esegue
          auto *scelta = v[id(rot_index)];
          id(next_page) = (scelta == id(matrix).get_active_page()) ? nullptr : scelta;

          // --- diagnostica: togli queste righe quando il collaudo e' finito ---
          ESP_LOGI("rot", "pagine=%d idx=%d | notte=%d pv=%.0f(%d) rete=%.0f(%d) ev=%d "
                          "batt=%.0f%%(%d)/%.0fW(%d)"
                          "pioggia=%.0f(%d) mm=%.1f(%d) pm25=%.0f(%d) lux=%.1f(%d) prato='%s'",
                   (int) v.size(), id(rot_index), (int) id(night_mode),
                   id(pv_power).has_state() ? id(pv_power).state : -1.0f,
                   (int) id(pv_power).has_state(),
                   id(grid_power).has_state() ? id(grid_power).state : -99999.0f,
                   (int) id(grid_power).has_state(),
                   (int) id(ev_charging).state,
                   id(batt_soc).has_state() ? id(batt_soc).state : -1.0f,
                   (int) id(batt_soc).has_state(),
                   id(batt_power).has_state() ? id(batt_power).state : -99999.0f,
                   (int) id(batt_power).has_state(),
                   id(rain_minutes).has_state() ? id(rain_minutes).state : -99.0f,
                   (int) id(rain_minutes).has_state(),
                   id(rain_now).has_state() ? id(rain_now).state : -1.0f,
                   (int) id(rain_now).has_state(),
                   id(pm25).has_state() ? id(pm25).state : -1.0f,
                   (int) id(pm25).has_state(),
                   id(lux_out).has_state() ? id(lux_out).state : -1.0f,
                   (int) id(lux_out).has_state(),
                   id(mower_state).has_state() ? id(mower_state).state.c_str() : "-");
      # --- dissolvenza attraverso il nero, ~150ms, solo se la pagina cambia ---
      - if:
          condition:
            lambda: 'return id(next_page) != nullptr && id(bright_target) > 0;'
          then:
            - hub75.set_brightness:
                id: matrix
                brightness: !lambda 'return id(bright_target) / 2;'
            - delay: 35ms
            - hub75.set_brightness: { id: matrix, brightness: 0 }
            - delay: 35ms
            - lambda: 'id(matrix).show_page(id(next_page)); id(matrix).update();'
            - hub75.set_brightness:
                id: matrix
                brightness: !lambda 'return id(bright_target) / 2;'
            - delay: 35ms
            - hub75.set_brightness:
                id: matrix
                brightness: !lambda 'return id(bright_target);'

# -----------------------------------------------------------------------------
#  Luminosita' adattiva + finestra di spegnimento (ogni 10s per reagire in fretta)
# -----------------------------------------------------------------------------
  - interval: 10s
    then:
      - script.execute: aggiorna_luminosita
