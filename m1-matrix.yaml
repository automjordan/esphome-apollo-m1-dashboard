# =============================================================================
#  Apollo Automation M-1 (HUB75 64x64) — display informativo per Home Assistant
#  Richiede ESPHome >= 2025.12 (componente display "hub75" ufficiale)
# =============================================================================

substitutions:
  device_name: m1-matrix
  friendly_name: "M-1 Matrix"

  # --- REVISIONE PCB: guarda la serigrafia sul controller ---
  # apollo-automation-m1-rev4  oppure  apollo-automation-m1-rev6
  m1_board: apollo-automation-m1-rev6

  # ------------------------- ENTITÀ HOME ASSISTANT -------------------------
  ent_temp_out:     sensor.gw1100_temp
  ent_weather:      weather.forecast_home                # met.no
  ent_pv_power:     sensor.inverter_input_power          # W prodotti
  ent_grid_power:   sensor.power_meter_active_power      # W: >0 consumo, <0 immetto
  ent_batt_soc:     sensor.batteries_state_of_capacity    # % batteria di casa
  ent_batt_power:   sensor.batteries_charge_discharge_power  # W: >0 carica, <0 scarica
  ent_ev_soc:       sensor.mg_mgs5_ev_state_of_charge    # %
  ent_ev_power:     sensor.prism_potenza                 # W
  ent_rain_minutes: sensor.minuti_alla_pioggia_nowcast   # -1 = niente pioggia (REST Tomorrow.io)
  ent_mower_state:  lawn_mower.tagliaerba
  ent_alarm:        alarm_control_panel.allarme
  ent_waste_carta:  sensor.carta
  ent_waste_plast:  sensor.plastica_vetro
  ent_waste_secco:  sensor.secco
  ora_rifiuti: "17"       # dalle 17 della sera prima compare il riquadro colorato
  ent_pm25:         sensor.soggiorno_apollo_sensore_aria_pm_2_5mm_weight_concentration
  ent_lux:          sensor.illuminance                   # lux di riferimento
  ent_rain_now:     sensor.gw1100_rainrate                # mm/h: >0 = sta piovendo ORA
  ent_rain_24h:     sensor.gw1100_last24hrain             # mm cumulati nelle 24h

  pv_max_w: "6000"        # fondo scala della barra fotovoltaico
  ev_charge_w: "1000"     # sopra questa potenza consideriamo la ricarica attiva
  lux_max: "200"          # lux a cui il display va alla luminosita' massima
  bright_min: "6"         # luminosita' minima notturna (0-255)
  pm25_warn: "15"         # soglie PM2.5 (adattale alle tue di Lovelace)
  pm25_bad: "25"

  # ------------------------------ ICONE MDI --------------------------------
  # Codepoint verificati sul repository ufficiale MaterialDesign-Webfont
  # (scss/_variables.scss). Per aggiungerne altri: pictogrammers.com/library/mdi,
  # campo "Codepoint", F0599 diventa "\U000F0599".
  mdi_sunny:        "\U000F0599"   # weather-sunny
  mdi_night:        "\U000F0594"   # weather-night
  mdi_partly:       "\U000F0595"   # weather-partly-cloudy
  mdi_cloudy:       "\U000F0590"   # weather-cloudy
  mdi_rainy:        "\U000F0597"   # weather-rainy
  mdi_pouring:      "\U000F0596"   # weather-pouring
  mdi_snowy:        "\U000F0598"   # weather-snowy
  mdi_fog:          "\U000F0591"   # weather-fog
  mdi_storm:        "\U000F0593"   # weather-lightning
  mdi_ev:           "\U000F05F1"   # ev-station
  mdi_umbrella:     "\U000F054A"   # umbrella
  mdi_mower:        "\U000F11F7"   # robot-mower
  mdi_air:          "\U000F0D43"   # air-filter
  mdi_washing:      "\U000F072A"   # washing-machine
  mdi_bell:         "\U000F009E"   # bell-ring
  mdi_door:         "\U000F081C"   # door-open
  mdi_power_off:    "\U000F06A6"   # power-plug-off
  mdi_alert:        "\U000F0026"   # alert

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - display.page.show: page_home

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret m1_api_key

  # Servizio richiamabile da Node-RED / HA:
  #   esphome.m1_matrix_show_alert
  actions:
    - action: show_alert
      variables:
        icon: string        # chiave: washing | bell | door | power | mower | alert | air
        line1: string
        line2: string
        r: int
        g: int
        b: int
        seconds: int
      then:
        - lambda: |-
            id(alert_icon)  = icon;
            id(alert_line1) = line1;
            id(alert_line2) = line2;
            id(alert_r) = r; id(alert_g) = g; id(alert_b) = b;
            id(alert_until) = millis() + (uint32_t)(seconds > 0 ? seconds : 15) * 1000UL;
        - display.page.show: page_alert
        - lambda: 'id(next_page) = nullptr;' 

    - action: clear_alert
      then:
        - lambda: 'id(alert_until) = 0;'
        - display.page.show: page_home

ota:
  - platform: esphome
    password: !secret m1_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "M1 Matrix Fallback"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

# =============================================================================
#  GLOBALI
# =============================================================================
globals:
  - id: alert_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: alert_icon
    type: std::string
    restore_value: no
    initial_value: '"alert"'
  - id: alert_line1
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: alert_line2
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: alert_r
    type: int
    restore_value: no
    initial_value: '255'
  - id: alert_g
    type: int
    restore_value: no
    initial_value: '255'
  - id: alert_b
    type: int
    restore_value: no
    initial_value: '255'
  - id: rot_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: wake_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: bright_target
    type: int
    restore_value: no
    initial_value: '90'
  - id: next_page
    type: display::DisplayPage*
    restore_value: no
    initial_value: 'nullptr'
  - id: night_mode
    type: bool
    restore_value: no
    initial_value: 'false'

# =============================================================================
#  DATI DA HOME ASSISTANT
# =============================================================================
sensor:
  - platform: homeassistant
    id: temp_out
    entity_id: ${ent_temp_out}
  - platform: homeassistant
    id: pv_power
    entity_id: ${ent_pv_power}
  - platform: homeassistant
    id: grid_power
    entity_id: ${ent_grid_power}
  - platform: homeassistant
    id: batt_soc
    entity_id: ${ent_batt_soc}
  - platform: homeassistant
    id: batt_power
    entity_id: ${ent_batt_power}
  - platform: homeassistant
    id: ev_soc
    entity_id: ${ent_ev_soc}
  - platform: homeassistant
    id: ev_power
    entity_id: ${ent_ev_power}
  - platform: homeassistant
    id: rain_minutes
    entity_id: ${ent_rain_minutes}
  - platform: homeassistant
    id: pm25
    entity_id: ${ent_pm25}
  - platform: homeassistant
    id: rain_now
    entity_id: ${ent_rain_now}
  - platform: homeassistant
    id: rain_24h
    entity_id: ${ent_rain_24h}
  - platform: homeassistant
    id: w_carta
    entity_id: ${ent_waste_carta}
    attribute: daysTo
  - platform: homeassistant
    id: w_plast
    entity_id: ${ent_waste_plast}
    attribute: daysTo
  - platform: homeassistant
    id: w_secco
    entity_id: ${ent_waste_secco}
    attribute: daysTo
  - platform: homeassistant
    id: lux_out
    name: "Lux letti dal display"     # per capire se il valore arriva davvero
    entity_id: ${ent_lux}
    unit_of_measurement: "lx"
    accuracy_decimals: 1
    filters:
      # media mobile: evita che una nuvola di passaggio faccia pompare il pannello
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

text_sensor:
  - platform: homeassistant
    id: weather_state
    entity_id: ${ent_weather}
  - platform: homeassistant
    id: mower_state
    entity_id: ${ent_mower_state}
  - platform: homeassistant
    id: alarm_state
    entity_id: ${ent_alarm}

binary_sensor:
  # volumetrici: risvegliano il display durante la finestra di spegnimento
  - platform: homeassistant
    id: pir_1
    entity_id: binary_sensor.sensore_volumetrico_1
    on_press:
      - script.execute: risveglio
  - platform: homeassistant
    id: pir_2
    entity_id: binary_sensor.sensore_volumetrico_2
    on_press:
      - script.execute: risveglio
  - platform: homeassistant
    id: pir_3
    entity_id: binary_sensor.sensore_volumetrico_3
    on_press:
      - script.execute: risveglio
  - platform: homeassistant
    id: pir_4
    entity_id: binary_sensor.sensore_volumetrico_4
    on_press:
      - script.execute: risveglio
  - platform: homeassistant
    id: pir_5
    entity_id: binary_sensor.sensore_volumetrico_5
    on_press:
      - script.execute: risveglio

  # non esiste un binary_sensor della wallbox: lo deriviamo dalla potenza.
  # delayed_off evita che la pagina sparisca durante le pause di modulazione.
  - platform: template
    id: ev_charging
    name: "Ricarica in corso"
    lambda: |-
      if (!id(ev_power).has_state() || std::isnan(id(ev_power).state)) return false;
      return id(ev_power).state > ${ev_charge_w};
    filters:
      - delayed_off: 3min

# =============================================================================
#  CONTROLLI ESPOSTI IN HOME ASSISTANT
# =============================================================================
number:
  - platform: template
    name: "Spegnimento alle"
    id: ora_spegnimento
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 23
    optimistic: true
    restore_value: true
    unit_of_measurement: "h"

  - platform: template
    name: "Riaccensione alle"
    id: ora_accensione
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 7
    optimistic: true
    restore_value: true
    unit_of_measurement: "h"

  - platform: template
    name: "Luminosità massima"
    id: brightness_ctl
    min_value: 0
    max_value: 255
    step: 5
    initial_value: 90
    optimistic: true
    restore_value: true
    set_action:
      - hub75.set_brightness:
          id: matrix
          brightness: !lambda 'return (int)x;'

switch:
  # Se spento, le pagine ruotano anche di notte (utile per il collaudo)
  - platform: template
    name: "Solo orologio di notte"
    id: night_pages
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Luminosità automatica"
    id: auto_brightness
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Display acceso"
    id: display_on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - hub75.set_brightness:
          id: matrix
          brightness: !lambda 'return (int)id(brightness_ctl).state;'
    turn_off_action:
      - hub75.set_brightness:
          id: matrix
          brightness: 0

# =============================================================================
#  SCRIPT
# =============================================================================
script:
  - id: risveglio
    mode: restart
    then:
      - lambda: 'id(wake_until) = millis() + 5 * 60 * 1000UL;'
      - script.execute: aggiorna_luminosita

  - id: aggiorna_luminosita
    mode: single
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          bool in_finestra = false;
          if (t.is_valid()) {
            int off = (int) id(ora_spegnimento).state;
            int on  = (int) id(ora_accensione).state;
            int h   = t.hour;
            if (off > on)      in_finestra = (h >= off || h < on);
            else if (off < on) in_finestra = (h >= off && h < on);
            id(night_mode) = id(night_pages).state && in_finestra;
          }
          bool sveglio = millis() < id(wake_until);

          int manuale = (int) id(brightness_ctl).state;
          int b;
          if (!id(display_on).state) {
            b = 0;                                   // spento a mano
          } else if (in_finestra && !sveglio) {
            b = 0;                                   // finestra notturna
          } else if (id(auto_brightness).state
                     && id(lux_out).has_state() && !std::isnan(id(lux_out).state)) {
            float lux = id(lux_out).state;
            if (lux < 0) lux = 0;
            if (lux > ${lux_max}) lux = ${lux_max};
            float f = std::log10(1.0f + lux) / std::log10(1.0f + ${lux_max}.0f);
            b = ${bright_min} + (int)((manuale - ${bright_min}) * f);
            if (b < ${bright_min}) b = ${bright_min};
            if (b > manuale) b = manuale;
          } else {
            b = manuale;
          }
          id(bright_target) = b;
      - hub75.set_brightness:
          id: matrix
          brightness: !lambda 'return id(bright_target);'

# =============================================================================
#  FONT
# =============================================================================
# Silkscreen: font a pixel, squadrato, disegnato sulla griglia. I proporzionali
# (Inter, Roboto) a corpo 8 spezzano le curve e il "9" esce storto.
# Le tre misure sono lo STESSO carattere: tutte le pagine restano coerenti.
# Alternative squadrate: gfonts://"Jersey 10"  gfonts://"Pixelify Sans"
font:
  - file: "gfonts://Silkscreen"
    id: font_xs
    size: 8
    glyphs: &g
      - " !\"%'()+,-.:/0123456789"
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      - "abcdefghijklmnopqrstuvwxyz"
  - file: "gfonts://Silkscreen"
    id: font_md
    size: 16
    glyphs: *g
  - file: "gfonts://Silkscreen"
    id: font_lg
    size: 18                  # massimo corpo con cui "88:88" sta in 62px.
                              # Se sfora, la home ripiega su font_md da sola.
    glyphs: " :0123456789"

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icon_28
    size: 28
    glyphs: &icons
      - ${mdi_sunny}
      - ${mdi_night}
      - ${mdi_partly}
      - ${mdi_cloudy}
      - ${mdi_rainy}
      - ${mdi_pouring}
      - ${mdi_snowy}
      - ${mdi_fog}
      - ${mdi_storm}
      - ${mdi_ev}
      - ${mdi_umbrella}
      - ${mdi_mower}
      - ${mdi_air}
      - ${mdi_washing}
      - ${mdi_bell}
      - ${mdi_door}
      - ${mdi_power_off}
      - ${mdi_alert}
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icon_14
    size: 14
    glyphs: *icons

# =============================================================================
#  DISPLAY
# =============================================================================
display:
  - platform: hub75
    id: matrix
    board: ${m1_board}
    panel_width: 64
    panel_height: 64
    brightness: 90
    bit_depth: 8
    gamma_correct: CIE1931
    double_buffer: true
    update_interval: 50ms       # il refresh del pannello deriva da qui:
                                # se sfarfalla scendi a 16ms, se scalda il
                                # processore sali a 100-200ms

    pages:

      # ----------------------------------------------------------- HOME ----
      - id: page_home
        lambda: |-
          // --- cornici di stato, disegnate prima del contenuto ---
          {
            // rifiuti: riquadro spesso 2px del colore della frazione, dalla sera
            // prima del ritiro. daysTo == 1 significa "domani passano".
            auto ora = id(ha_time).now();
            if (ora.is_valid() && ora.hour >= ${ora_rifiuti}) {
              float d[3] = {
                id(w_carta).has_state() ? id(w_carta).state : NAN,
                id(w_plast).has_state() ? id(w_plast).state : NAN,
                id(w_secco).has_state() ? id(w_secco).state : NAN
              };
              Color col[3] = {Color(255,200,0), Color(40,120,255), Color(170,70,220)};
              for (int i = 0; i < 3; i++) {
                if (std::isnan(d[i]) || d[i] != 1) continue;
                it.rectangle(1, 1, 62, 62, col[i]);
                it.rectangle(2, 2, 60, 60, col[i]);
                break;
              }
            }
            // allarme: 1px sul bordo esterno, sopra a tutto
            const std::string &al = id(alarm_state).has_state() ? id(alarm_state).state : "";
            if (al.rfind("armed", 0) == 0)
              it.rectangle(0, 0, 64, 64, Color(150,20,20));
            else if (al == "arming" || al == "pending")
              it.rectangle(0, 0, 64, 64, Color(190,120,0));
          }
          auto t = id(ha_time).now();
          if (!t.is_valid()) {
            it.print(32, 28, id(font_xs), Color(90,90,95),
                     TextAlign::TOP_CENTER, "sync");
            return;
          }

          // --- ora: elemento dominante, in alto ---
          int bx, by, bw, bh;
          it.get_text_bounds(0, 0, "88:88", id(font_lg), TextAlign::TOP_LEFT,
                             &bx, &by, &bw, &bh);
          auto *f_ora = (bw <= 62) ? id(font_lg) : id(font_md);
          it.strftime(32, 2, f_ora, Color(255,255,255),
                      TextAlign::TOP_CENTER, "%H:%M", t);

          // --- data: solo giorno e mese, maiuscolo perche' si legge meglio ---
          static const char* mm[] = {"GEN","FEB","MAR","APR","MAG","GIU",
                                     "LUG","AGO","SET","OTT","NOV","DIC"};
          it.printf(32, 31, id(font_xs), Color(105,105,112), TextAlign::TOP_CENTER,
                    "%d %s", t.day_of_month, mm[t.month - 1]);

          // --- riga bassa: icona meteo + temperatura ---
          std::string w = id(weather_state).has_state() ? id(weather_state).state : "";
          const char* ic = "${mdi_cloudy}";
          if      (w == "sunny")        ic = "${mdi_sunny}";
          else if (w == "clear-night")  ic = "${mdi_night}";
          else if (w == "partlycloudy") ic = "${mdi_partly}";
          else if (w == "rainy")        ic = "${mdi_rainy}";
          else if (w == "pouring")      ic = "${mdi_pouring}";
          else if (w == "snowy" || w == "snowy-rainy") ic = "${mdi_snowy}";
          else if (w == "fog")          ic = "${mdi_fog}";
          else if (w == "lightning" || w == "lightning-rainy") ic = "${mdi_storm}";
          it.print(18, 44, id(font_icon_14), Color(190,190,200), TextAlign::TOP_CENTER, ic);

          if (id(temp_out).has_state() && !std::isnan(id(temp_out).state)) {
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", id(temp_out).state);
            it.get_text_bounds(0, 0, buf, id(font_md), TextAlign::TOP_LEFT,
                               &bx, &by, &bw, &bh);
            int x0 = 44 - (bw + 5) / 2;
            it.print(x0, 42, id(font_md), Color(255,255,255), TextAlign::TOP_LEFT, buf);
            it.filled_rectangle(x0 + bw + 2, 42 + by, 3, 3, Color(255,255,255));
          }

      # ------------------------------------------------------ FOTOVOLTAICO -
      - id: page_pv
        lambda: |-
          // --- cornici di stato, disegnate prima del contenuto ---
          {
            // rifiuti: riquadro spesso 2px del colore della frazione, dalla sera
            // prima del ritiro. daysTo == 1 significa "domani passano".
            auto ora = id(ha_time).now();
            if (ora.is_valid() && ora.hour >= ${ora_rifiuti}) {
              float d[3] = {
                id(w_carta).has_state() ? id(w_carta).state : NAN,
                id(w_plast).has_state() ? id(w_plast).state : NAN,
                id(w_secco).has_state() ? id(w_secco).state : NAN
              };
              Color col[3] = {Color(255,200,0), Color(40,120,255), Color(170,70,220)};
              for (int i = 0; i < 3; i++) {
                if (std::isnan(d[i]) || d[i] != 1) continue;
                it.rectangle(1, 1, 62, 62, col[i]);
                it.rectangle(2, 2, 60, 60, col[i]);
                break;
              }
            }
            // allarme: 1px sul bordo esterno, sopra a tutto
            const std::string &al = id(alarm_state).has_state() ? id(alarm_state).state : "";
            if (al.rfind("armed", 0) == 0)
              it.rectangle(0, 0, 64, 64, Color(150,20,20));
            else if (al == "arming" || al == "pending")
              it.rectangle(0, 0, 64, 64, Color(190,120,0));
          }
          float pv   = id(pv_power).has_state()   ? id(pv_power).state   : NAN;
          float grid = id(grid_power).has_state() ? id(grid_power).state : NAN;
          float bsoc = id(batt_soc).has_state()   ? id(batt_soc).state   : NAN;
          float bpw  = id(batt_power).has_state() ? id(batt_power).state : NAN;

          const Color DIM = Color(140,140,150);
          // rete: rosso se prelevo, verde se immetto, ambra vicino allo zero
          Color cg = std::isnan(grid) ? DIM
                   : grid < -100 ? Color(0,230,90)
                   : grid >  100 ? Color(255,60,50)
                                 : Color(255,170,30);
          // batteria: verde se carica, ambra se scarica
          Color cb = std::isnan(bpw) ? DIM
                   : bpw > 50  ? Color(0,230,90)
                   : bpw < -50 ? Color(255,170,30)
                               : DIM;

          // colonna sinistra 2-48, barra della produzione a destra 50-62
          it.print(2, 0, id(font_xs), DIM, "SOLARE");
          if (!std::isnan(pv))
            it.printf(2, 9, id(font_xs), Color(255,190,40), "%.1f kW", pv / 1000.0f);

          it.print(2, 21, id(font_xs), DIM, "RETE");
          if (!std::isnan(grid))
            it.printf(2, 30, id(font_xs), cg, "%+.0f W", grid);

          if (!std::isnan(bsoc))
            it.printf(2, 42, id(font_xs), DIM, "BATT %.0f%%", bsoc);
          else
            it.print(2, 42, id(font_xs), DIM, "BATT");
          if (!std::isnan(bpw))
            it.printf(2, 51, id(font_xs), cb, "%+.1f kW", bpw / 1000.0f);

          int x0 = 50, y0 = 6, h = 54, w = 12;
          it.rectangle(x0, y0, w, h, Color(90,90,100));
          if (!std::isnan(pv)) {
            float frac = pv / ${pv_max_w}.0f;
            if (frac > 1) frac = 1;
            if (frac < 0) frac = 0;
            int fh = (int)(frac * (h - 2));
            if (fh > 0)
              it.filled_rectangle(x0 + 1, y0 + h - 1 - fh, w - 2, fh, Color(255,190,40));
          }

      # ------------------------------------------------------------- EV ----
      - id: page_ev
        lambda: |-
          // --- cornici di stato, disegnate prima del contenuto ---
          {
            // rifiuti: riquadro spesso 2px del colore della frazione, dalla sera
            // prima del ritiro. daysTo == 1 significa "domani passano".
            auto ora = id(ha_time).now();
            if (ora.is_valid() && ora.hour >= ${ora_rifiuti}) {
              float d[3] = {
                id(w_carta).has_state() ? id(w_carta).state : NAN,
                id(w_plast).has_state() ? id(w_plast).state : NAN,
                id(w_secco).has_state() ? id(w_secco).state : NAN
              };
              Color col[3] = {Color(255,200,0), Color(40,120,255), Color(170,70,220)};
              for (int i = 0; i < 3; i++) {
                if (std::isnan(d[i]) || d[i] != 1) continue;
                it.rectangle(1, 1, 62, 62, col[i]);
                it.rectangle(2, 2, 60, 60, col[i]);
                break;
              }
            }
            // allarme: 1px sul bordo esterno, sopra a tutto
            const std::string &al = id(alarm_state).has_state() ? id(alarm_state).state : "";
            if (al.rfind("armed", 0) == 0)
              it.rectangle(0, 0, 64, 64, Color(150,20,20));
            else if (al == "arming" || al == "pending")
              it.rectangle(0, 0, 64, 64, Color(190,120,0));
          }
          // niente icona qui: serviva solo a decorare e rubava 14px verticali
          // fasce: 8-24 batteria, 28-44 percentuale, 50-58 potenza
          float soc = id(ev_soc).has_state() ? id(ev_soc).state : NAN;
          float kw  = id(ev_power).has_state() ? id(ev_power).state / 1000.0f : NAN;

          // batteria centrata: corpo 48 + puntale 3 = 51px, quindi x da 6 a 57
          int x0 = 6, y0 = 8, w = 48, h = 16;
          it.rectangle(x0, y0, w, h, Color(200,200,200));
          it.filled_rectangle(x0 + w, y0 + 5, 3, 6, Color(200,200,200));
          if (!std::isnan(soc)) {
            int fw = (int)((soc / 100.0f) * (w - 4));
            Color bc = soc < 20 ? Color(255,60,50) : soc < 60 ? Color(255,170,30) : Color(0,230,90);
            if (fw > 0) it.filled_rectangle(x0 + 2, y0 + 2, fw, h - 4, bc);
            it.printf(32, 28, id(font_md), Color(255,255,255), TextAlign::TOP_CENTER, "%.0f%%", soc);
          }
          if (!std::isnan(kw))
            it.printf(32, 50, id(font_xs), Color(90,200,255), TextAlign::TOP_CENTER, "%.1f kW", kw);

