              };
              Color col[3] = {Color(255,200,0), Color(40,120,255), Color(170,70,220)};
              for (int i = 0; i < 3; i++) {
                if (std::isnan(d[i]) || d[i] != 1) continue;
                it.rectangle(1, 1, 62, 62, col[i]);
                it.rectangle(2, 2, 60, 60, col[i]);
                break;
              }
            }
            // allarme: 1px sul bordo esterno, sopra a tutto
            const std::string &al = id(alarm_state).has_state() ? id(alarm_state).state : "";
            if (al.rfind("armed", 0) == 0)
              it.rectangle(0, 0, 64, 64, Color(150,20,20));
            else if (al == "arming" || al == "pending")
              it.rectangle(0, 0, 64, 64, Color(190,120,0));
          }
          it.print(32, 2, id(font_icon_28), Color(70,150,255), TextAlign::TOP_CENTER, "${mdi_umbrella}");

          // il pluviometro batte la previsione: se sta gia' piovendo, inutile
          // dire fra quanto pioveva
          float mm = id(rain_now).has_state() ? id(rain_now).state : 0;
          if (!std::isnan(mm) && mm > 0) {
            it.print(32, 32, id(font_md), Color(70,150,255), TextAlign::TOP_CENTER, "PIOVE");
            float h24 = id(rain_24h).has_state() ? id(rain_24h).state : NAN;
            if (!std::isnan(h24))
              it.printf(32, 52, id(font_xs), Color(120,150,200), TextAlign::TOP_CENTER,
                        "%.1f MM 24H", h24);
            else
              it.printf(32, 52, id(font_xs), Color(120,150,200), TextAlign::TOP_CENTER,
                        "%.1f MM/H", mm);
            return;
          }

          float m = id(rain_minutes).has_state() ? id(rain_minutes).state : NAN;
          if (std::isnan(m)) return;
          // riga grande = quanto manca, riga piccola = a cosa si riferisce.
          // A corpo 8 ci stanno ~10 caratteri: "PIOGGIA" sta, "ALLA PIOGGIA" no.
          if (m <= 1) {
            it.print(32, 32, id(font_md), Color(70,150,255), TextAlign::TOP_CENTER, "ORA");
          } else {
            it.printf(32, 32, id(font_md), Color(70,150,255), TextAlign::TOP_CENTER,
                      "%.0f MIN", m);
          }
          it.print(32, 52, id(font_xs), Color(120,150,200), TextAlign::TOP_CENTER, "PIOGGIA");

