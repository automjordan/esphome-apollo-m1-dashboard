          }
          std::string s = id(mower_state).has_state() ? id(mower_state).state : "";
          for (auto &ch : s) ch = tolower(ch);
          bool err = s.find("error") != std::string::npos
                  || s.find("errore") != std::string::npos
                  || s.find("fault") != std::string::npos
                  || s.find("blocc") != std::string::npos;
          Color c = err ? Color(255,60,50) : Color(0,220,120);
          it.print(32, 4, id(font_icon_28), c, TextAlign::TOP_CENTER, "${mdi_mower}");
          it.print(32, 42, id(font_xs), c, TextAlign::TOP_CENTER,
