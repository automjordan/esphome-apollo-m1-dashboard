        lambda: |-
          bool acceso = (millis() / 400) % 2 == 0;
          Color c = acceso ? Color(255,30,20) : Color(70,8,5);
          it.filled_rectangle(0, 0, 64, 12, c);
          it.filled_rectangle(0, 52, 64, 12, c);
          it.print(32, 20, id(font_md), Color(255,255,255), TextAlign::TOP_CENTER, "ALLARME");
